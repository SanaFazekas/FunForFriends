        // Helper: Calculate Dynamic Result based on option counts (A, B, C, D, E)
        function calculateDynamicOutcome(themeKey, userAnswers) {
            const theme = themes[themeKey];
            const counts = { A: 0, B: 0, C: 0, D: 0, E: 0 };
            
            userAnswers.forEach((answerIndex, qIdx) => {
                const question = theme.questions[qIdx];
                if (question && question.options[answerIndex]) {
                    const type = question.options[answerIndex].type;
                    if (counts[type] !== undefined) {
                        counts[type]++;
                    }
                }
            });

            // Find outcome type with highest count
            let maxType = 'A';
            let maxCount = -1;
            for (const [type, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    maxType = type;
                }
            }

            // Fallback to outcome corresponding to maxType
            return theme.outcomes[maxType] || theme.outcomes['A'];
        }

        // Action Handlers
        function handleNicknameSubmit() {
            const input = document.getElementById('nickname-input');
            const val = input ? input.value.trim() : '';
            if (!val) {
                alertCustom("Please enter your quirky nickname to proceed!");
                return;
            }
            state.nickname = val;
            state.step = 2;
            render();
        }

        function selectTheme(themeKey) {
            state.selectedTheme = themeKey;
            state.currentQuestionIndex = 0;
            state.answers = [];
            state.step = 3;
            render();
        }

        function handleAnswer(optionIndex) {
            state.answers.push(optionIndex);
            const theme = themes[state.selectedTheme];
            
            if (state.currentQuestionIndex < theme.questions.length - 1) {
                state.currentQuestionIndex++;
                render();
            } else {
                // Quiz completed -> calculate dynamic result
                state.resultData = calculateDynamicOutcome(state.selectedTheme, state.answers);
                state.step = 4;
                render();
                // Trigger Gemini API image generation for animal character head
                generateAvatarImage();
            }
        }

        function resetQuiz() {
            state.step = 2;
            state.selectedTheme = null;
            state.currentQuestionIndex = 0;
            state.answers = [];
            state.resultData = null;
            state.generatedImageUrl = null;
            render();
        }

            const existingModal = document.getElementById('custom-alert-modal');

            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50';

            `;

        // Gemini API integration for character animal head avatar generation
        async function generateAvatarImage() {
            state.isLoadingImage = true;
            render();

            const prompt = `A whimsical, highly stylized digital character portrait head of an adorable animal avatar representing ${state.resultData.title}, bright pastel light theme, cute playful cartoon illustration style, professional digital art, isolated clean background.`;
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }],
                generationConfig: {
                    responseModalities: ['TEXT', 'IMAGE']
                }
            };

            try {
                // Exponential backoff retry loop
                let response;
                let delay = 1000;
                for (let attempt = 0; attempt < 3; attempt++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {
                        if (attempt === 2) throw err;
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }

                if (response && response.ok) {
                    const result = await response.json();
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64Data) {
                        state.generatedImageUrl = `data:image/png;base64,${base64Data}`;
                    }
                }
            } catch (err) {
                console.error("Avatar generation fallback:", err);
            } finally {
                state.isLoadingImage = false;
                render();
            }
        }

        // Download Text Report Functionality
        function downloadReport() {
            const theme = themes[state.selectedTheme];
            const outcome = state.resultData;
            const reportContent = `========================================\n` +
                                  `   THE GREAT QUIRKY PERSONA DOSSIER   \n` +
                                  `========================================\n\n` +
                                  `Nickname: ${state.nickname}\n` +
                                  `Theme: ${theme.title}\n` +
                                  `Result Title: ${outcome.title}\n\n` +
                                  `Description:\n${outcome.desc}\n\n` +
                                  `Evaluation Summary:\n` +
                                  `${state.nickname}, the ${outcome.title}... Your quirky choices across the ${theme.title} realm confirm your exceptional humor.\n\n` +
                                  `----------------------------------------\n` +
                                  `Certified 100% Banished Age Free Zone\n` +
                                  `Generated by Quirky Persona Quiz Game`;

            const blob = new Blob([reportContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.nickname}_Quirky_Dossier.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // HTML Escape Helper
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initialize App on Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
